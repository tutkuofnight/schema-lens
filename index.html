<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗃️</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>SchemaLens - DB Schema Visualizer</title>
    <meta name="title" content="SchemaLens - DB Schema Visualizer" />
    <meta
      name="description"
      content="Visualize your Drizzle, Prisma, or SQL database schemas as interactive diagrams instantly. Free, open-source tool for developers."
    />
    <meta
      name="keywords"
      content="database diagram, schema visualizer, drizzle orm, prisma, sql, erd tool, database design, developer tools"
    />
    <meta name="author" content="SchemaLens Team" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://schemalens.com/" />
    <meta property="og:title" content="SchemaLens - DB Schema Visualizer" />
    <meta
      property="og:description"
      content="Visualize your Drizzle, Prisma, or SQL database schemas as interactive diagrams instantly."
    />
    <meta property="og:image" content="https://schemalens.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://schemalens.com/" />
    <meta
      property="twitter:title"
      content="SchemaLens - DB Schema Visualizer"
    />
    <meta
      property="twitter:description"
      content="Visualize your Drizzle, Prisma, or SQL database schemas as interactive diagrams instantly."
    />
    <meta
      property="twitter:image"
      content="https://schemalens.com/og-image.png"
    />

    <link rel="canonical" href="https://schemalens.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SchemaLens",
        "url": "https://schemalens.com",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "Visualize your Drizzle, Prisma, or SQL database schemas as interactive diagrams.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": "Interactive database diagrams, SQL parser, Drizzle ORM support, Prisma support",
        "author": {
          "@type": "Organization",
          "name": "SchemaLens Team"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
